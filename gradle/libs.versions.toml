coreSplashscreen = "1.2.0"
gson = "2.15.0"
hiltAndroid = "2.60.1"
hiltAndroidCompiler = "2.60.1"
hiltNavigationCompose = "1.4.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
kotlinxSerializationJson = "1.9.0"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
